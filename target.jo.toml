[target.m2_max]
arch       = "arm64"
p_cores    = 8
e_cores    = 2
cache_line = 128
l1d        = 131072        # 128 KiB
l2         = 16777216      # 16 MiB
slc        = 100663296     # 96 MiB
ram        = 137438953472  # 128 GiB

[target.i7_1185g7]
arch       = "x86_64"
p_cores    = 4
cache_line = 64
l1d        = 196608
l2         = 5242880
l3         = 12582912
ram        = 33285996544

[target.zen4_7500f]
arch = "x86_64"
cpu = "znver4"
cores = 6
threads_per_core = 2
cache_line = 64
l1d = 32768
l2 = 1048576
l3 = 33554432
memory_model = "tso"
store_release = "mov"
triple = "x86_64-unknown-linux-gnu"
mmap_flags = ["MAP_PRIVATE", "MAP_ANONYMOUS", "MAP_HUGETLB"]
timing_api = "clock_gettime"